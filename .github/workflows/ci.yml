name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  audit:
    name: trust invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audit itself lives in .github/scripts/trust-audit.sh — one source of truth,
      # shared with the release workflow so tags can't bypass it.
      - name: The two-minute audit must stay empty
        run: bash .github/scripts/trust-audit.sh

  swift:
    name: swift parity (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path app
