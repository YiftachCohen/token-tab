name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        tz: [UTC]
        include:
          - { node: 22, tz: Pacific/Auckland }
          - { node: 22, tz: America/Los_Angeles }
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  audit:
    name: trust invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audit itself lives in .github/scripts/trust-audit.sh — one source of truth,
      # shared with the release workflow so tags can't bypass it.
      - name: The two-minute audit must stay empty
        run: bash .github/scripts/trust-audit.sh

      # AGENTS.md's "edit the price tables in lockstep" rule, as numbers-level checks
      # the coverage fixture can't express (value drift, input/output split, multipliers).
      - name: Rate tables mirrored (JS ↔ Swift)
        run: node .github/scripts/rates-parity.mjs

      # DESIGN.md's token rule: no new raw color/font literals outside Theme.swift.
      - name: Design tokens stay in Theme.swift
        run: bash .github/scripts/design-lint.sh

  swift:
    name: swift parity (macos, ${{ matrix.tz }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path app
