name: Release

# Guard rails for a release tag. Signing and notarization stay LOCAL on purpose —
# the Developer ID private key never goes into CI secrets (see RELEASING.md). This
# workflow proves the tagged commit is releasable, then opens a draft release for
# the locally-built, notarized zip to be attached to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: verify tag + draft release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json and Info.plist
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Bundle/Info.plist)"
          echo "tag=$TAG package.json=$PKG Info.plist=$PLIST"
          [ "$TAG" = "$PKG" ]   || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
          [ "$TAG" = "$PLIST" ] || { echo "::error::tag v$TAG != Info.plist $PLIST"; exit 1; }

      # Same audit ci.yml runs on pushes/PRs. Tags don't trigger ci.yml, and a tag can
      # point at any commit — no release draft without the invariants holding HERE.
      - name: Trust-invariant audit
        run: bash .github/scripts/trust-audit.sh

      - name: JS engine tests
        run: node --test

      - name: Swift engine tests (parity)
        run: swift test --package-path app

      - name: App bundle assembles (ad-hoc; the shipped zip is built + notarized locally)
        run: bash app/Scripts/build-app.sh release

      - name: npm tarball
        run: npm pack

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            --title "Token Tab $GITHUB_REF_NAME" \
            ycstudios-token-tab-*.tgz
          echo "Draft created. Attach the notarized app zip built locally:"
          echo "  app/Scripts/package-app.sh ${GITHUB_REF_NAME#v}"
          echo "  gh release upload $GITHUB_REF_NAME dist/Token-Tab-${GITHUB_REF_NAME#v}.zip dist/Token-Tab-${GITHUB_REF_NAME#v}.zip.sha256"
          echo "then publish the draft."
